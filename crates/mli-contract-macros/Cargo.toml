# Proc-macro crate for the MLI contract engine. Owns `contract_universe!`,
# which generates the box-free `ContractFactory`, the `id -> contract` catalog
# projections, and the per-family box-free slot-runtime enums from ONE
# declarative member list. Published: `mylittleindicators` does not build
# without it.
[package]
name = "mli-contract-macros"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "contract_universe! proc-macro for the mylittleindicators contract engine."
repository = "https://github.com/ZENG3LD/mylittleindicators"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
