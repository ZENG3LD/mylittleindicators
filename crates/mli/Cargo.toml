# The OSS crate. Directory is `crates/mli`; the published cargo/crates.io
# name stays `mylittleindicators`. This is the ONLY publishable crate in the
# workspace — all siblings (mli-ewa, mli-strategies, mli-validator) are
# non-OSS family crates. Keeps `src/` pure indicators + events + taxonomy.
[package]
name = "mylittleindicators"
version = "0.2.0"
edition = "2024"
description = "Multi-stream financial indicators library — 556 bar indicators + 21 event primitives across 35 categories. Consumes 27 stream kinds from digdigdig3 exchange connectors: OHLCV bars, ticks, orderbook (snapshot/delta/L3), funding/predicted funding/funding settlement, mark price, index price, open interest, liquidations, ticker, agg trades, long/short ratio, option greeks, volatility index, historical volatility, basis (derived), composite index, settlement events, block trades, insurance fund, risk limit, market warning, and three kline-family variants. Live-verified on 12 exchanges (89% pass-rate on a 150s BTC slice)."
license = "MIT"
readme = "README.md"
repository = "https://github.com/ZENG3LD/mylittleindicators"
keywords = ["indicators", "trading", "technical-analysis", "orderbook", "market-data"]
categories = ["finance", "api-bindings"]

[dependencies]
# The contract engine's proc-macro: `contract_universe!` generates the box-free
# ContractFactory + the id->contract catalog projections + per-family slot-runtime
# enums from ONE member list. NON-OSS — lives only in this private fork.
mli-contract-macros = { path = "../mli-contract-macros" }
# Light data-types crate only — NO connectors/reqwest/tokio/websockets.
# Consumed by local path (0.3.24) — most reliable: resolves locally in any
# build context, no crates.io version-pin drift.
digdigdig3-core = { version = "0.3.24", path = "../../../digdigdig3/crates/dig3-core" }
once_cell = "1.21"
# EnumIter derive on BarIndicatorId/EventId — single source of truth for "all
# variants". Lightweight, no proc-macro runtime cost; replaces hand-maintained
# ID lists in downstream consumers (mlq codegen).
strum = { version = "0.27", features = ["derive"] }
arrayvec = "0.7"
rayon = "1.10"

[features]
# Opt-in: route `cost_points*` through the embedded measured calibration table
# (`data/cost_calibration.rs`, a Rust slice generated by `mli-barometer`'s `calibrate`
# bin — NO serde, NO runtime I/O) instead of the structural `WEIGHTS` rubric. OFF by
# default → the pure structural prior, with no dependency on the generated file.
calibrated = []
