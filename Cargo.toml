# Branch `mli-contract`. Virtual workspace. The only crate intended for OSS
# publication is `crates/mli` (cargo name `mylittleindicators`).
#
# Not in this tree, on purpose: `mli-strategies`, `mli-validator`,
# `mli-barometer`, and `validator_data`. Those stay in the private
# `mylittleindicators-contract` repo. `mli-contract-macros` is here only
# because `crates/mli` does not build without `contract_universe!`. It stays
# `publish = false` until that boundary is decided.
[workspace]
resolver = "2"
members = ["crates/*"]
